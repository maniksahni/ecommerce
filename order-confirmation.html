<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Order Confirmed | The Shivara Group</title>
    <meta name="description" content="Thank you for your purchase from The Shivara Group. View your order confirmation and dispatch details." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231a1512'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='Georgia,serif' font-size='38' fill='%23d8b36a'%3ES%3C/text%3E%3C/svg%3E" />
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231a1512'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='Georgia,serif' font-size='38' fill='%23d8b36a'%3ES%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Italiana&amp;display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/commerce-stable.css?v=6" />
    <style>
      .confirmation-hero {
        background: radial-gradient(circle at 50% 20%, #2a221a 0%, #15110d 100%);
        color: #f7f2ea;
        padding: 56px 20px 48px;
        text-align: center;
        position: relative;
        overflow: hidden;
      }
      .confirmation-hero::after {
        content: "";
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 1px;
        background: linear-gradient(90deg, transparent, #c5a059, transparent);
      }
      .confirmation-badge-icon {
        width: 72px;
        height: 72px;
        margin: 0 auto 20px;
        background: linear-gradient(135deg, #10b981, #059669);
        border: 2px solid rgba(255,255,255,0.3);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
        color: #fff;
        box-shadow: 0 0 30px rgba(16, 185, 129, 0.4);
        animation: scaleIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      }
      @keyframes scaleIn {
        from { transform: scale(0.5); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
      }
      .confirmation-title {
        font-family: "Italiana", Georgia, serif;
        font-size: clamp(28px, 4vw, 42px);
        letter-spacing: 0.04em;
        margin: 0 0 10px;
        color: #f7f2ea;
      }
      .confirmation-subtitle {
        font-size: 15px;
        color: #d1c7bc;
        max-width: 540px;
        margin: 0 auto;
        line-height: 1.6;
      }
      .confirmation-container {
        max-width: 1040px;
        margin: -24px auto 60px;
        padding: 0 20px;
        position: relative;
        z-index: 2;
      }
      .confirmation-grid {
        display: grid;
        grid-template-columns: 1.3fr 1fr;
        gap: 24px;
      }
      @media (max-width: 820px) {
        .confirmation-grid {
          grid-template-columns: 1fr;
        }
      }
      .confirmation-card {
        background: #fff;
        border: 1px solid #e8e2d8;
        border-radius: 12px;
        padding: 28px;
        box-shadow: 0 10px 30px rgba(26, 21, 18, 0.06);
      }
      .card-header-flex {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #f0ebe1;
        padding-bottom: 16px;
        margin-bottom: 20px;
      }
      .card-header-flex h3 {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
        color: #1a1512;
      }
      .order-status-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        background: #fef3c7;
        color: #92400e;
      }
      .order-status-pill.status-shipped {
        background: #dbeafe;
        color: #1e40af;
      }
      .order-status-pill.status-delivered {
        background: #d1fae5;
        color: #065f46;
      }
      .order-status-pill.status-cancelled {
        background: #fee2e2;
        color: #991b1b;
      }
      .order-meta-row {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
        gap: 16px;
        background: #faf8f5;
        padding: 16px;
        border-radius: 8px;
        margin-bottom: 24px;
      }
      .meta-block small {
        display: block;
        font-size: 11px;
        text-transform: uppercase;
        color: #8c827a;
        letter-spacing: 0.05em;
        margin-bottom: 4px;
      }
      .meta-block strong {
        font-size: 14px;
        color: #1a1512;
      }
      .item-row {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 14px 0;
        border-bottom: 1px solid #f5f0eb;
      }
      .item-row:last-child {
        border-bottom: none;
      }
      .item-thumb {
        width: 60px;
        height: 60px;
        border-radius: 6px;
        object-fit: cover;
        background: #f5efe6;
        border: 1px solid #e8e2d8;
        flex-shrink: 0;
      }
      .item-info {
        flex: 1;
      }
      .item-info h4 {
        margin: 0 0 4px;
        font-size: 14px;
        font-weight: 600;
        color: #1a1512;
      }
      .item-info p {
        margin: 0;
        font-size: 12px;
        color: #8c827a;
      }
      .item-price {
        font-weight: 600;
        font-size: 14px;
        color: #1a1512;
        text-align: right;
      }
      .cost-breakdown {
        margin-top: 20px;
        padding-top: 16px;
        border-top: 2px dashed #ece5da;
      }
      .cost-row {
        display: flex;
        justify-content: space-between;
        font-size: 14px;
        color: #635b54;
        margin-bottom: 8px;
      }
      .cost-row.total-row {
        font-size: 17px;
        font-weight: 700;
        color: #1a1512;
        padding-top: 8px;
        border-top: 1px solid #f0ebe1;
        margin-top: 12px;
      }
      .shipping-detail-block {
        font-size: 13px;
        color: #4a423b;
        line-height: 1.6;
        background: #faf8f5;
        padding: 16px;
        border-radius: 8px;
        margin-bottom: 20px;
      }
      .shipping-detail-block strong {
        color: #1a1512;
      }
      .assurance-pill-box {
        display: flex;
        flex-direction: column;
        gap: 10px;
        background: #fdfbf7;
        border: 1px solid #ebdcc5;
        border-radius: 8px;
        padding: 14px;
        font-size: 12px;
        color: #6d5b43;
        margin-bottom: 20px;
      }
      .assurance-pill-box span {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .action-buttons {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .loading-state {
        text-align: center;
        padding: 60px 20px;
        color: #8c827a;
      }
      .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid #e8e2d8;
        border-top-color: #c5a059;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 16px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body data-page="order-confirmation" class="catalog-stable">
    <a class="visually-hidden skip-to-content" href="#main">Skip to content</a>
    <div id="shared-header"></div>

    <main id="main">
      <section class="confirmation-hero">
        <div class="confirmation-badge-icon">✓</div>
        <h1 class="confirmation-title">Thank You For Your Purchase</h1>
        <p class="confirmation-subtitle">
          Your order has been confirmed and is being carefully prepared at our Bareilly atelier with complimentary velvet gift packaging.
        </p>
      </section>

      <div class="confirmation-container" id="confirmation-mount">
        <div class="loading-state">
          <div class="spinner"></div>
          <p>Loading your order details...</p>
        </div>
      </div>
    </main>

    <div id="shared-footer"></div>

    <!-- Core Storefront Scripts -->
    <script src="/shop-data.js?v=source-1"></script>
    <script src="/catalog-supplement.js?v=3"></script>
    <script src="/catalog-overrides.js?v=3"></script>
    <script src="/catalog-data.js?v=3"></script>
    <script src="/storefront-renderer.js?v=3"></script>
    <script src="/script.js?v=stable-5"></script>

    <!-- ══════════════════════════════════════════════
         FIRESTORE ORDER HYDRATION SCRIPT
    ══════════════════════════════════════════════ -->
    <script type="module">
      import { db } from "/src/firebase.js";
      import { doc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

      const INR = new Intl.NumberFormat("en-IN", {
        style: "currency",
        currency: "INR",
        maximumFractionDigits: 0
      });

      function escapeHtml(s) {
        return String(s ?? "").replace(/[&<>"']/g, (c) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
        })[c]);
      }

      async function loadOrder() {
        const mount = document.getElementById("confirmation-mount");
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get("id") || "";

        let orderData = null;

        // 1. Try Firestore First
        if (orderId) {
          try {
            const docRef = doc(db, "orders", orderId);
            const docSnap = await getDoc(docRef);
            if (docSnap.exists()) {
              orderData = { id: docSnap.id, ...docSnap.data() };
            }
          } catch (err) {
            console.warn("[Confirmation] Firestore fetch note:", err);
          }
        }

        // 2. Fallback to localStorage guest order
        if (!orderData) {
          try {
            const cached = JSON.parse(localStorage.getItem("shivara_recent_order"));
            if (cached && (!orderId || cached.orderId === orderId)) {
              orderData = cached;
            }
          } catch {}
        }

        if (!orderData) {
          mount.innerHTML = `
            <div class="confirmation-card" style="text-align:center; padding: 48px 20px;">
              <h2 style="font-family:'Italiana',serif; margin-bottom:12px;">Order Not Found</h2>
              <p style="color:#8c827a; margin-bottom:24px;">We could not locate the requested order reference ${orderId ? `<strong>(${escapeHtml(orderId)})</strong>` : ""}.</p>
              <div style="display:flex; justify-content:center; gap:12px;">
                <a href="/track-order.html" class="stable-button stable-button--dark">Track Order</a>
                <a href="/collections/all" class="stable-button stable-button--plain">Shop Collection</a>
              </div>
            </div>
          `;
          return;
        }

        const items = orderData.items || [];
        const status = orderData.status || "Pending";
        const statusClass = `status-${status.toLowerCase()}`;
        const customer = orderData.shippingDetails || orderData.customerInfo || {};
        const total = orderData.totalAmount || items.reduce((sum, i) => sum + (Number(i.price) * (i.quantity || 1)), 0) || 499;

        const dateFormatted = orderData.date || (orderData.createdAt ? new Date(orderData.createdAt.seconds * 1000).toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" }) : new Date().toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" }));

        const itemsHtml = items.map(item => {
          const thumb = item.imageUrl || "/assets/instagram-shop/post-051-DW3H_GZDD_4.jpg";
          const qty = item.quantity || 1;
          const itemTotal = (Number(item.price) || 0) * qty;
          return `
            <div class="item-row">
              <img src="${escapeHtml(thumb)}" class="item-thumb" alt="${escapeHtml(item.title)}" />
              <div class="item-info">
                <h4>${escapeHtml(item.title)}</h4>
                <p>SKU: ${escapeHtml(item.sku || "SHV-LUXE")} · Qty: ${qty}${item.variantLabel ? ` · ${escapeHtml(item.variantLabel)}` : ""}</p>
              </div>
              <div class="item-price">${INR.format(itemTotal)}</div>
            </div>
          `;
        }).join("");

        mount.innerHTML = `
          <div class="confirmation-grid">
            <!-- Left Column: Itemized Order & Pricing -->
            <div class="confirmation-card">
              <div class="card-header-flex">
                <h3>Order Summary</h3>
                <span class="order-status-pill ${statusClass}">● ${escapeHtml(status)}</span>
              </div>

              <div class="order-meta-row">
                <div class="meta-block">
                  <small>Order Ref</small>
                  <strong>#${escapeHtml(orderData.orderId || orderId)}</strong>
                </div>
                <div class="meta-block">
                  <small>Order Date</small>
                  <strong>${escapeHtml(dateFormatted)}</strong>
                </div>
                <div class="meta-block">
                  <small>Payment</small>
                  <strong>Direct / Prepaid</strong>
                </div>
              </div>

              <div class="items-list">
                ${itemsHtml}
              </div>

              <div class="cost-breakdown">
                <div class="cost-row">
                  <span>Subtotal</span>
                  <span>${INR.format(total)}</span>
                </div>
                <div class="cost-row">
                  <span>Signature Velvet Gift Box</span>
                  <span style="color:#10b981; font-weight:600;">Complimentary (₹0)</span>
                </div>
                <div class="cost-row">
                  <span>Insured PAN-India Express Delivery</span>
                  <span style="color:#10b981; font-weight:600;">FREE</span>
                </div>
                <div class="cost-row total-row">
                  <span>Total Amount</span>
                  <span>${INR.format(total)}</span>
                </div>
              </div>
            </div>

            <!-- Right Column: Shipping Details & Tracking -->
            <div class="confirmation-card">
              <div class="card-header-flex">
                <h3>Shipping &amp; Delivery</h3>
              </div>

              <div class="shipping-detail-block">
                <p style="margin:0 0 6px;"><strong>Recipient:</strong> ${escapeHtml(customer.name || orderData.customerName || "Guest Customer")}</p>
                <p style="margin:0 0 6px;"><strong>Contact:</strong> +91 ${escapeHtml(customer.phone || orderData.customerPhone || "N/A")}</p>
                <p style="margin:0 0 6px;"><strong>Address:</strong> ${escapeHtml(customer.address || orderData.shippingAddress || "N/A")}</p>
                <p style="margin:0 0 6px;"><strong>PIN Code:</strong> ${escapeHtml(customer.pincode || orderData.pincode || "N/A")}</p>
                ${(customer.note || orderData.orderNote) ? `<p style="margin:6px 0 0; color:#8c827a; font-style:italic;">Note: “${escapeHtml(customer.note || orderData.orderNote)}”</p>` : ""}
              </div>

              <div class="assurance-pill-box">
                <span>🛡️ <strong>100% Anti-Tarnish Lifetime Warranty</strong></span>
                <span>✨ <strong>Handcrafted Studio Quality Checked</strong></span>
                <span>📦 <strong>Dispatched within 24 hours</strong></span>
              </div>

              <div class="action-buttons">
                <a href="/track-order.html?id=${encodeURIComponent(orderData.orderId || orderId)}" class="stable-button stable-button--dark" style="text-align:center;">Track Order Status</a>
                <a href="/collections/all" class="stable-button stable-button--plain" style="text-align:center;">Continue Shopping</a>
              </div>
            </div>
          </div>
        `;
      }

      window.addEventListener("DOMContentLoaded", loadOrder);
    </script>
  </body>
</html>
