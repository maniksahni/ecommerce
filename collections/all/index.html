<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ALL | Shivara.luxe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css?v=jlt-shop-1" />
  </head>
  <body data-page="collection" data-collection="All">
    <a class="visually-hidden skip-to-content" href="#main">Skip to content</a>
    <div id="shared-header"></div>
    <main id="main" class="anchor">
      <section class="shopify-section shopify-section--main-collection">
        <div class="container">
          <nav class="breadcrumb text--xsmall"><ol class="breadcrumb__list"><li class="breadcrumb__item"><a class="breadcrumb__link" href="/">Home</a></li><li class="breadcrumb__item">All products</li></ol></nav>
          <product-facet class="product-facet">
            <aside class="product-facet__aside">
              <div class="product-facet__aside-inner">
                <h2 class="product-facet__filter-heading h5">Filters</h2>
                <facet-filters class="product-facet__filters" id="facet-filters"></facet-filters>
              </div>
            </aside>
            <div class="product-facet__main anchor">
              <div class="product-facet__meta-bar anchor"><button class="filter-toggle hidden-lap-and-up" type="button" data-filter-open>Filters</button><span>Sort by</span><button class="sort-button" type="button">Featured</button></div>
              <div class="product-on-page product-list__inner" id="collection-grid"></div>
            </div>
          </product-facet>
        </div>
      </section>
    </main>
    <div id="shared-footer"></div>
    <script src="/shop-data.js?v=full-shop-ig"></script>
    <script src="/script.js?v=jlt-shop-1"></script>
  </body>
</html>
