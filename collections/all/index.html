<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ALL | Shivara.luxe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Italiana&amp;display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css?v=commerce-luxe-2" />
    <link rel="stylesheet" href="/storefront-v2.css?v=commerce-density-1" />
    <link rel="stylesheet" href="/atelier.css?v=atelier-1" />
  </head>
  <body data-page="collection" data-collection="All" class="commerce-home commerce-collection">
    <a class="visually-hidden skip-to-content" href="#main">Skip to content</a>
    <noscript><div class="noscript-commerce">The collection remains browsable below. Enable JavaScript for filters, wishlist and Quick View.</div></noscript>
    <div id="shared-header"></div>
    <main id="main" class="anchor">
      <section class="shopify-section shopify-section--main-collection">
        <div class="container">
          <nav class="breadcrumb text--xsmall"><ol class="breadcrumb__list"><li class="breadcrumb__item"><a class="breadcrumb__link" href="/">Home</a></li><li class="breadcrumb__item">All products</li></ol></nav>
          <header class="collection-hero">
            <p class="section-kicker">Full jewellery wardrobe</p>
            <h2>All Shivara drops</h2>
            <p>Browse the complete edit: rings, pendants, bracelets, earrings, gifts, and anti-tarnish statement pieces.</p>
          </header>
          <product-facet class="product-facet">
            <aside class="product-facet__aside">
              <div class="product-facet__aside-inner">
                <h2 class="product-facet__filter-heading h5">Filters</h2>
                <facet-filters class="product-facet__filters" id="facet-filters"></facet-filters>
              </div>
            </aside>
            <div class="product-facet__main anchor">
              <div class="product-facet__meta-bar anchor"><button class="filter-toggle hidden-lap-and-up" type="button" data-filter-open>Filters</button><strong data-collection-count>Products</strong><span>Sort by</span><button class="sort-button" type="button">Featured</button></div>
              <div class="product-on-page product-list__inner" id="collection-grid"></div>
            </div>
          </product-facet>
        </div>
      </section>
    </main>
    <div id="shared-footer"></div>
    <script src="/shop-data.js?v=full-shop-ig"></script>
    <script src="/script.js?v=atelier-1"></script>
  </body>
</html>
