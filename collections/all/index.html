<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Browse the curated Shivara jewellery catalogue." />
    <title>All Products | Shivara</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Italiana&amp;display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css?v=legacy" />
    <link rel="stylesheet" href="/storefront-v2.css?v=legacy" />
    <link rel="stylesheet" href="/atelier.css?v=legacy" />
    <link rel="stylesheet" href="/commerce-stable.css?v=2" />
  </head>
  <body data-page="collection" data-collection="all" class="catalog-stable">
    <a class="visually-hidden skip-to-content" href="#main">Skip to content</a>
    <div id="shared-header"></div>
    <main id="main" class="stable-page">
      <nav class="stable-breadcrumb"><a href="/">Home</a><span>/</span><span data-collection-breadcrumb>All products</span></nav>
      <header class="stable-collection-hero">
        <p data-collection-kicker>THE COMPLETE CATALOGUE</p>
        <h1 data-collection-title>All products</h1>
        <p data-collection-description>Browse Shivara products that have been manually reviewed for catalogue accuracy.</p>
      </header>
      <div class="stable-collection-toolbar">
        <strong data-collection-count>0 products</strong>
        <label>Sort <select id="collection-sort"><option value="featured">Featured</option><option value="newest">Newest</option><option value="price-low">Price: low to high</option><option value="price-high">Price: high to low</option><option value="title">Alphabetical</option></select></label>
      </div>
      <div class="stable-collection-layout">
        <aside class="stable-filters" id="collection-filters"></aside>
        <section><div class="commerce-product-grid" id="collection-grid"></div><div class="stable-empty" id="collection-empty" hidden><h2>No products here yet</h2><p>This collection has no confirmed catalogue entries.</p><a href="/collections/all">Browse all products</a></div></section>
      </div>
    </main>
    <div id="shared-footer"></div>
    <script src="/shop-data.js?v=source-1"></script>
    <script src="/catalog-overrides.js?v=2"></script>
    <script src="/catalog-data.js?v=2"></script>
    <script src="/script.js?v=stable-2"></script>
    <script src="/motion-controller.js?v=stable-2"></script>
  </body>
</html>
