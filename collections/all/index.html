<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231a1512'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='Georgia,serif' font-size='38' fill='%23d8b36a'%3ES%3C/text%3E%3C/svg%3E" />
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231a1512'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='Georgia,serif' font-size='38' fill='%23d8b36a'%3ES%3C/text%3E%3C/svg%3E" />
    <meta name="description" content="Browse the curated Shivara jewellery catalogue." />
    <title>All Products | Shivara</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Italiana&amp;display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/commerce-stable.css?v=v9-purge" />
  </head>
  <body data-page="collection" data-collection="all" class="catalog-stable">
    <a class="visually-hidden skip-to-content" href="#main">Skip to content</a>
    <div id="shared-header"></div>
    <main id="main" class="stable-page">
      <nav class="stable-breadcrumb"><a href="/">Home</a><span>/</span><span data-collection-breadcrumb>All products</span></nav>
      <header class="stable-collection-hero">
        <p data-collection-kicker>THE COMPLETE CATALOGUE</p>
        <h1 data-collection-title>All products</h1>
        <p data-collection-description>Browse Shivara products that have been manually reviewed for catalogue accuracy.</p>
      </header>
      <nav class="stable-collection-chips" aria-label="Shop by category">
        <a href="/collections/all">All</a>
        <a href="/collections/new-arrivals">New</a>
        <a href="/collections/earrings">Earrings</a>
        <a href="/collections/necklaces">Neck Wear</a>
        <a href="/collections/bracelets">Bracelets</a>
        <a href="/collections/rings">Rings</a>
        <a href="/collections/evil-eye">Evil Eye</a>
        <a href="/collections/watches">Watches</a>
      </nav>
      <div class="stable-collection-search">
        <label for="collection-search">Search this collection</label>
        <div>
          <span aria-hidden="true">⌕</span>
          <input id="collection-search" type="search" inputmode="search" autocomplete="off" placeholder="Search jewellery" />
          <button type="button" data-collection-search-clear aria-label="Clear collection search" hidden>×</button>
        </div>
      </div>
      <div class="stable-collection-toolbar">
        <strong data-collection-count>0 products</strong>
        <div class="stable-collection-toolbar__actions">
          <button type="button" data-filter-toggle aria-expanded="false" aria-controls="collection-filters">Filter</button>
          <label><span>Sort</span><select id="collection-sort" aria-label="Sort products"><option value="featured">Featured</option><option value="newest">Newest</option><option value="price-low">Price: low to high</option><option value="price-high">Price: high to low</option><option value="title">Alphabetical</option></select></label>
        </div>
      </div>
      <div class="stable-collection-layout">
        <aside class="stable-filters" id="collection-filters"></aside>
        <section><div class="commerce-product-grid" id="collection-grid"></div><button class="stable-load-more" id="collection-load-more" type="button" data-load-more hidden>Load more products</button><!-- COLLECTION_EMPTY_STATE --></section>
      </div>
    </main>
    <div id="shared-footer"></div>
    <script src="/shop-data.js?v=v9-purge"></script>
    <script src="/catalog-supplement.js?v=v9-purge"></script>
    <script src="/catalog-overrides.js?v=v9-purge"></script>
    <script src="/catalog-data.js?v=v9-purge"></script>
    <script src="/storefront-renderer.js?v=v9-purge"></script>
    <script src="/script.js?v=v9-purge"></script>
  </body>
</html>
