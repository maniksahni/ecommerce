name: Approved SHIVARA Screenshot Preview QA

on:
  push:
    branches:
      - design/shivara-approved-screenshot-match
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shivara-approved-design-qa
  cancel-in-progress: true

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify real catalogue and assets
        run: npm test
      - name: Build hosting preview
        run: npm run build
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Start static hosting preview
        run: |
          python3 -m http.server 3000 --directory dist >/tmp/shivara-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/shivara-preview.log
          exit 1
      - name: Verify 320px to 1440px, mobile controls and imagery
        env:
          APPROVED_BASE_URL: http://127.0.0.1:3000
        run: npm run test:approved
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shivara-approved-reference-screenshots
          path: artifacts/approved-storefront/
          if-no-files-found: ignore
          retention-days: 7

# No production deploy. This draft design requires screenshot approval and
# preservation of the previously restored product images before Hosting release.
